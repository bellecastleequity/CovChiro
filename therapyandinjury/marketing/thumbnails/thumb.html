<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Marker; src: url(../../node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #071f40; }
.t { position: relative; width: 1280px; height: 720px; font-family: Inter, sans-serif; color: #fff; }
.bg { position: absolute; inset: 0; background: url(../video/scenes/wide/morning-neck.jpg) 72% 40% / cover no-repeat; transform: scale(1.18); transform-origin: 78% 45%; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(7 31 64 / 97%) 0%, rgb(7 31 64 / 90%) 36%, rgb(7 31 64 / 35%) 60%, rgb(7 31 64 / 0%) 78%); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #19ccbe; }
.copy { position: absolute; left: 64px; top: 70px; width: 700px; }
.quote { font-family: Marker; font-size: 64px; transform: rotate(-4deg); display: inline-block; position: relative; color: #fff; text-shadow: 0 4px 0 rgb(0 0 0 / 35%); }
.quote::after { content: ''; position: absolute; left: -10px; right: -14px; top: 60%; height: 7px; background: #ff4d5e; border-radius: 6px; transform: rotate(-3deg); box-shadow: 0 2px 0 rgb(0 0 0 / 30%); }
h1 { margin-top: 30px; font-weight: 900; font-size: 128px; line-height: .9; letter-spacing: -.035em; text-transform: uppercase; text-shadow: 0 6px 18px rgb(0 0 0 / 45%); }
h1 span { color: #19ccbe; }
.num { margin-top: 34px; display: inline-flex; align-items: center; gap: 14px; background: #19ccbe; color: #071f40; font-weight: 900; font-size: 50px; letter-spacing: -.02em; padding: 10px 26px 12px; border-radius: 999px; box-shadow: 0 8px 24px rgb(0 0 0 / 35%); }
.badge { position: absolute; right: 64px; top: 128px; width: 168px; height: 168px; border-radius: 50%; background: #071f40; border: 7px solid #19ccbe; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(8deg); box-shadow: 0 10px 30px rgb(0 0 0 / 45%); }
.badge b { font-size: 76px; font-weight: 900; line-height: .9; }
.badge small { font-size: 21px; font-weight: 800; letter-spacing: .14em; color: #19ccbe; }
.brand { position: absolute; right: 54px; top: 40px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 28px; text-shadow: 0 2px 10px rgb(0 0 0 / 70%); }
.brand img { width: 46px; height: 46px; }
</style></head>
<body><!-- Bottom-right stays clear: YouTube covers it with the video length. --><div class="t">
  <div class="bg"></div><div class="shade"></div>
  <div class="copy">
    <div class="quote">“I’m fine.”</div>
    <h1>Don’t<br>walk it<br><span>off.</span></h1>
    <div class="num">(844) 84-TREAT</div>
  </div>
  <div class="badge"><b>14</b><small>DAYS</small></div>
  <div class="brand"><img src="../../public/brand/mark-white.svg" alt="">Therapy &amp; Injury</div>
  <div class="bar"></div>
</div></body></html>
