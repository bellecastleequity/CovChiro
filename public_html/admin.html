<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<header>
  <div class="wrap">
    <div class="brand"><img src="assets/logo.png" alt="" style="height:44px;width:44px;border-radius:8px;"><div class="brand-text">Coverage<span> Chiropractor</span><div style="font-size:0.66rem;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;text-transform:uppercase;color:#6b7280;font-weight:400;margin-top:1px;">Provider Portal</div></div></div>

      <a href="index.html">Home</a>

</header>

<!-- ADMIN PORTAL -->
<section id="admin" style="background:var(--paper-2);">
  <div class="wrap">
    <div class="section-head">
      <span class="mono">Provider portal</span>
      <h2>Availability &amp; schedule</h2>
      <p>Block out dates you're unavailable. Blocked dates and confirmed bookings are both removed from the public booking calendar automatically.</p>
    </div>
    <div class="admin-grid">
      <div class="admin-card">
        <h3>Block out dates</h3>
        <label for="bl-start">From</label>
        <input type="date" id="bl-start">
        <label for="bl-end">To (leave blank for a single day)</label>
        <input type="date" id="bl-end">
        <label for="bl-scope">Scope</label>
        <select id="bl-scope">
          <option value="all">All day — fully unavailable</option>
          <option value="am">Mornings only (before 12pm)</option>
          <option value="pm">Afternoons only (after 12pm)</option>
        </select>
        <label for="bl-note">Reason (private, for your reference)</label>
        <input type="text" id="bl-note" placeholder="e.g. CE seminar, family, USVI trip">
        <button class="btn" id="bl-add" style="width:100%;margin-top:16px;">Block these dates</button>
        <div class="err-msg" id="bl-err"></div>
      </div>
      <div>
        <div class="dash-tabs">
          <button class="dash-tab on" data-adm="blocks">Blocked dates</button>
          <button class="dash-tab" data-adm="booked">Booked dates</button>
          <button class="dash-tab" data-adm="video">Video requests</button>
          <button class="dash-tab" data-adm="promo">Promo codes</button>
          <button class="dash-tab" data-adm="inventory">Inventory alerts</button>
          <button class="dash-tab" data-adm="standing">Standing days</button>
          <button class="dash-tab" data-adm="analytics">Analytics</button>
          <button class="dash-tab" data-adm="messages">Messages</button>
          <button class="dash-tab" data-adm="documents">Documents</button>
        </div>
        <div id="admin-list"></div>
      </div>
    </div>
  </div>
</section>



<script src="assets/app-shared.js"></script>
<script>
let adminBookings = [], videoRequests = [], promoCodes = [], admView = 'blocks', latestAnalytics = null;
let chatThreads = [], activeChatThread = null, activeChatMessages = [];
let docStatus = {};
async function loadAdminBookings(){
  try { adminBookings = (await apiFetch('/api/booking.php?action=list_all')).bookings || []; }
  catch (e) { adminBookings = []; }
}
function openDatesInWindow(daysAhead){
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  for (let i = 1; i <= daysAhead; i++){
    const d = new Date(today); d.setDate(d.getDate() + i);
    const dateStr = d.toISOString().slice(0,10);
    const blackedOut = blackouts.some(b => b.scope === 'all' && rangeDates(b.start, b.end).includes(dateStr));
    const booked = allBooked.some(bk => bk.dates && bk.dates.includes(dateStr));
    if (!blackedOut && !booked) out.push({ date: dateStr, daysOut: i });
  }
  return out;
}
function suggestFlexDiscount(daysOut, openCount){
  let pct = daysOut <= 1 ? 0 : daysOut <= 3 ? 20 : daysOut <= 7 ? 15 : daysOut <= 14 ? 10 : 5;
  if (openCount >= 5) pct += 5; // more open dates nearby means a bigger nudge helps fill them
  return Math.min(40, pct);
}
function pastClientList(){
  const seen = new Map();
  const byEmail = new Map();
  adminBookings.forEach(b => {
    if (!b.email) return;
    if (!seen.has(b.email)) seen.set(b.email, { email: b.email, name: b.who || '', lastDate: b.start });
    else if (b.start > seen.get(b.email).lastDate) seen.get(b.email).lastDate = b.start;
    if (!byEmail.has(b.email)) byEmail.set(b.email, []);
    byEmail.get(b.email).push(b);
  });
  return Array.from(seen.values()).map(c => {
    const rs = recurringStatus(byEmail.get(c.email) || []);
    let loyaltyLabel, loyaltyActive = false;
    if (rs.active){ loyaltyLabel = 'Recurring Clinic — 5% active'; loyaltyActive = true; }
    else if (rs.qualified) loyaltyLabel = 'Recurring reward lapsed';
    else loyaltyLabel = `${rs.cumDays}/${RECURRING_QUALIFY_DAYS} days toward recurring`;
    return { ...c, loyaltyLabel, loyaltyActive };
  }).sort((a,b) => b.lastDate.localeCompare(a.lastDate));
}
function standingDatesNeedingVolumeTomorrow(){
  const tomorrow = localDateStr(new Date(Date.now() + 864e5));
  const out = [];
  standingAgreements.forEach(a => {
    if (a.status === 'cancelled') return;
    a.dates.forEach(d => {
      if (d.date === tomorrow && d.status !== 'cancelled' && (d.patientVolume === null || d.patientVolume === undefined)){
        out.push({ agreementName: a.name, contactEmail: a.contactEmail, date: d.date });
      }
    });
  });
  return out;
}
function draftPatientVolumeReminderEmail(clinicName, dateStr){
  const subject = `Quick reminder: patient count for tomorrow's coverage (${dateStr})`;
  const body = `Hi ${clinicName},

Just a reminder that tomorrow, ${dateStr}, is a scheduled standing-day coverage date. If you haven't already, could you log in and note how many patients you have scheduled for that block? It just helps me plan the day accurately.

You can update it directly from your account at coveragechiropractor.com — takes less than a minute.

Michael L. McPherson, D.C.
coveragechiropractor.com`;
  return { subject, body };
}
function bookingsNeedingFeedback(){
  return adminBookings.filter(b => b.completedAt && !b.feedback && b.total > 0);
}
function draftFeedbackRequestEmail(clinicName, bookingId){
  const subject = `Quick feedback on your recent coverage?`;
  const body = `Hi ${clinicName},

Thanks again for having me cover for you recently. If you have two minutes, I'd really appreciate quick feedback on how it went — punctuality, how things felt with your patients, anything worth knowing before the next visit.

You can leave it directly from your account at coveragechiropractor.com — it's separate from a public review and goes straight to me.

Michael L. McPherson, D.C.
coveragechiropractor.com`;
  return { subject, body };
}
function draftThankYouLetter(booking){
  const clinicName = booking.who || 'there';
  const dateRange = booking.dates.length > 1 ? `${booking.dates[0]} through ${booking.dates[booking.dates.length-1]}` : booking.dates[0];
  const subject = `Thanks for having me — ${dateRange}`;
  const body = `Dear ${clinicName},

Thank you for having me cover ${dateRange}. I wanted to follow up while it's still fresh, both to say thanks and to pass along anything from the day that might be useful.

How the day went:
[Patients seen, general flow, anything that stood out]

Staff:
[Anything worth mentioning about the team, or friction worth smoothing out next time]

Building & equipment:
[Anything that made the day harder than it needed to be]

Patients:
[Any patient notes worth passing back to the regular doctor]

If any of this raises a question, I'm easy to reach — cell or email both work. And if you'd like to get a date on the calendar for next time, I'm happy to help with that too.

Thanks again,
Michael L. McPherson, D.C.
coveragechiropractor.com`;
  return { subject, body };
}
function draftOutreachEmail(dateStr, daysOut){
  const dayLabel = daysOut <= 1 ? 'tomorrow' : `in ${daysOut} days`;
  // The automatic 10% discount only activates within 24 hours of the
  // date (today/tomorrow) — see isLastMinute(). A date further out than
  // that shouldn't promise a discount it doesn't actually have yet;
  // the email just flags the opening and leaves the door open to a
  // manually-issued promo code if you want to sweeten it yourself.
  const isDiscounted = daysOut <= 1;
  const subject = isDiscounted
    ? `Coverage opening ${dayLabel} — 10% off if booked now`
    : `Coverage opening ${dayLabel} at my Central FL rate`;
  const body = isDiscounted
    ? `Hi,

A coverage date just opened up on ${dateStr} (${dayLabel}). It's within 24 hours, so it automatically qualifies for the 10% last-minute discount when booked.

You can book it directly at coveragechiropractor.com — the discount applies automatically once you're in the window, no code needed. Reply here if you'd rather I just pencil it in.

Michael L. McPherson, D.C.
coveragechiropractor.com`
    : `Hi,

A coverage date just opened up on ${dateStr} (${dayLabel} from now). Wanted to flag it in case it's useful for your schedule — vacation coverage, an extra set of hands, or just having someone lined up in advance.

You can see current rates and book directly at coveragechiropractor.com. If you'd like, reply here and I can also put together a specific rate for this date.

Michael L. McPherson, D.C.
coveragechiropractor.com`;
  return { subject, body, isDiscounted };
}
function renderAdmin(){
  const el = $('admin-list');
  if (admView === 'blocks'){
    if (!blackouts.length){
      el.innerHTML = `<div class="empty">No blocked dates. Add one on the left to close off time you're unavailable.</div>`;
      return;
    }
    const scopeLabel = s => s === 'all' ? 'All day' : s === 'am' ? 'Mornings' : 'Afternoons';
    el.innerHTML = blackouts.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(b => `
      <div class="blk">
        <div>
          <div class="bd">${b.start}${b.end && b.end !== b.start ? ' → ' + b.end : ''}</div>
          <div class="bn">${scopeLabel(b.scope)}${b.note ? ' · ' + b.note : ''}</div>
        </div>
        <button class="btn ghost sm" data-unblock="${b.id}">Remove</button>
      </div>`).join('');
    el.querySelectorAll('[data-unblock]').forEach(btn => btn.addEventListener('click', async () => {
      try { await apiFetch('/api/booking.php?action=blackout_remove', { method: 'POST', body: JSON.stringify({ id: btn.dataset.unblock }) }); }
      catch (e) { alert(e.message); }
      await loadAvailability(); renderAdmin();
    }));
  } else if (admView === 'booked') {
    const list = adminBookings.slice().sort((a,b) => a.dates[0].localeCompare(b.dates[0]));
    if (!list.length){
      el.innerHTML = `<div class="empty">No bookings on the calendar yet.</div>`;
      return;
    }
    el.innerHTML = list.map(b => {
      const owed = b.total != null && b.paid != null ? +(b.total - b.paid).toFixed(2) : null;
      const canComplete = ['office', 'homevisit', 'event'].includes(b.service) && b.balanceStatus === 'not_due';
      const rem = (b.balanceStatus === 'due' && b.completedAt) ? (() => {
        const hoursSince = (Date.now() - new Date(b.completedAt).getTime()) / 36e5;
        return { sent: Math.max(0, Math.floor(hoursSince / 12)), nextIn: (12 - (hoursSince % 12)).toFixed(1) };
      })() : null;
      return `
      <div class="blk booked">
        <div>
          <div class="bd">${b.dates[0]}${b.dates.length > 1 ? ' → ' + b.dates[b.dates.length-1] : ''}</div>
          <div class="bn">${b.title}${b.who ? ' · ' + b.who : ''} · Ref ${b.id}</div>
          ${b.meta ? `<div class="bn" style="margin-top:2px;">${b.meta}</div>` : ''}
          ${b.total != null ? `<div class="bn" style="margin-top:4px;">${money(b.total)} total · ${money(b.paid)} paid${owed > 0 ? ` · <strong style="color:var(--red);">${money(owed)} owed</strong>` : ''}</div>` : ''}
          ${b.balanceStatus === 'due' ? `<div class="bn" style="color:var(--ochre);margin-top:4px;">Balance due${rem ? ` — reminder ${rem.sent} sent, next in ~${rem.nextIn}h` : ''}</div>` : ''}
          ${b.balanceStatus === 'paid' ? `<div class="bn" style="color:var(--teal-dark);margin-top:4px;">Paid in full</div>` : ''}
          ${b.review ? `<div class="bn" style="margin-top:4px;">★ ${b.review.rating}/5${b.review.text ? ' — "' + b.review.text + '"' : ''}</div>` : ''}
          ${b.feedback ? (() => { const f = b.feedback; const low = f.punctuality <= 2 || f.professionalism <= 2 || f.patientCare <= 2 || f.wouldRebook === 'no'; return `
            <div class="bn" style="margin-top:4px;${low ? 'color:var(--red);font-weight:600;' : ''}">${low ? '⚠ Needs follow-up — ' : ''}Feedback: punctuality ${f.punctuality}/5, professionalism ${f.professionalism}/5, patient care ${f.patientCare}/5, rebook: ${f.wouldRebook}${f.notes ? ' — "' + f.notes + '"' : ''}</div>`; })() : ''}
          ${b.coverage && (b.coverage.patientVolume || b.coverage.postedHours || b.coverage.dress || (b.coverage.techniques && b.coverage.techniques.length) || b.coverage.notes || b.coverage.pocName) ? `
            <div style="font-size:0.78rem;color:#5a6472;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">
              ${b.coverage.patientVolume ? `<div><strong>Expected patient volume:</strong> ${b.coverage.patientVolume}</div>` : ''}
              ${b.coverage.postedHours ? `<div><strong>Practice posted hours (reference only):</strong> ${b.coverage.postedHours}</div>` : ''}
              ${b.coverage.dress ? `<div><strong>Dress code:</strong> ${b.coverage.dress}</div>` : ''}
              ${b.coverage.techniques && b.coverage.techniques.length ? `<div style="margin-top:3px;"><strong>Techniques:</strong> ${b.coverage.techniques.join(', ')}</div>` : ''}
              ${b.coverage.notes ? `<div style="margin-top:3px;"><strong>Notes:</strong> ${b.coverage.notes}</div>` : ''}
              ${b.coverage.pocName ? `<div style="margin-top:3px;color:var(--teal-dark);font-weight:600;"><strong>Day-of contact:</strong> ${b.coverage.pocName}${b.coverage.pocTitle ? ' (' + b.coverage.pocTitle + ')' : ''}${b.coverage.pocPhone ? ' · ' + b.coverage.pocPhone : ''}</div>` : ''}
            </div>` : ''}
          ${canComplete ? `<div style="margin-top:10px;"><button class="btn sm" data-complete="${b.id}">Mark coverage complete</button></div>` : ''}
          ${b.completedAt ? `<div style="margin-top:10px;"><button class="btn ghost sm" data-draft-thanks="${b.id}">Draft thank-you letter</button></div>` : ''}
          <div style="margin-top:10px;"><a class="btn ghost sm" href="api/agreement.php?type=booking&id=${b.id}" target="_blank" rel="noopener">Signed agreement</a></div>
        </div>
      </div>`;
    }).join('') + `
      <div class="admin-card hidden" id="thanks-draft-card" style="margin-top:20px;">
        <h3>Draft thank-you letter</h3>
        <label for="thanks-subject">Subject</label>
        <input type="text" id="thanks-subject">
        <label for="thanks-body" style="margin-top:12px;">Body</label>
        <textarea id="thanks-body" rows="14"></textarea>
        <button class="btn ghost sm" id="thanks-copy" style="margin-top:12px;">Copy to clipboard</button>
        <span id="thanks-copied" style="font-size:0.8rem;color:var(--teal-dark);margin-left:10px;"></span>
      </div>`;
    el.querySelectorAll('[data-draft-thanks]').forEach(btn => btn.addEventListener('click', () => {
      const b = adminBookings.find(x => x.id === btn.dataset.draftThanks);
      if (!b) return;
      const { subject, body } = draftThankYouLetter(b);
      $('thanks-subject').value = subject;
      $('thanks-body').value = body;
      $('thanks-draft-card').classList.remove('hidden');
      $('thanks-draft-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }));
    const thanksCopyBtn = $('thanks-copy');
    if (thanksCopyBtn) thanksCopyBtn.addEventListener('click', async () => {
      const text = `Subject: ${$('thanks-subject').value}\n\n${$('thanks-body').value}`;
      try {
        await navigator.clipboard.writeText(text);
        $('thanks-copied').textContent = 'Copied!';
      } catch {
        $('thanks-copied').textContent = 'Select the text above and copy manually.';
      }
      setTimeout(() => { $('thanks-copied').textContent = ''; }, 3000);
    });
    el.querySelectorAll('[data-complete]').forEach(btn => btn.addEventListener('click', async () => {
      const b = adminBookings.find(x => x.id === btn.dataset.complete);
      if (!b) return;
      const owed = +(b.total - b.paid).toFixed(2);
      if (!confirm(`Mark ${b.id} complete? This invoices ${b.who || 'the client'} for the ${money(owed)} balance and starts twice-daily reminders until it's paid.`)) return;
      try { await apiFetch('/api/booking.php?action=mark_complete', { method: 'POST', body: JSON.stringify({ id: b.id }) }); }
      catch (e) { alert(e.message); return; }
      await loadAdminBookings();
      renderAdmin();
    }));
  } else if (admView === 'video'){
    if (!videoRequests.length){
      el.innerHTML = `<div class="empty">No video interview requests yet.</div>`;
      return;
    }
    el.innerHTML = videoRequests.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r => `
      <div class="blk booked">
        <div>
          <div class="bd">${r.date} · ${r.time}</div>
          <div class="bn">${r.name} · ${r.email}</div>
          <div class="bn" style="margin-top:4px;color:#8a8171;">Requested ${new Date(r.requestedAt).toLocaleDateString()}</div>
        </div>
      </div>`).join('');
  } else if (admView === 'promo'){
    const today = new Date().toISOString().slice(0,10);
    const lmHtml = `
      <div class="admin-card" style="margin-bottom:20px;">
        <h3>Last-minute discount</h3>
        <p style="font-size:0.85rem;color:#6b7280;margin-bottom:12px;">Automatically takes 10% off any coverage date still open within 24 hours of its start — fills otherwise-empty dates without discounting your standard rate.</p>
        <label class="tq" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="lm-toggle" ${lastMinuteEnabled ? 'checked' : ''}>
          <span>Enabled — apply automatically to qualifying dates</span>
        </label>
      </div>`;
    const formHtml = `
      <div class="admin-card" style="margin-bottom:20px;">
        <h3>Create promo code</h3>
        <label for="pc-code">Code</label>
        <input type="text" id="pc-code" placeholder="e.g. WELCOME10" style="text-transform:uppercase;">
        <div class="row2">
          <div><label for="pc-type">Type</label>
            <select id="pc-type"><option value="percent">% off</option><option value="fixed">$ off</option></select>
          </div>
          <div><label for="pc-value">Value</label>
            <input type="number" id="pc-value" min="0" step="0.01" placeholder="10">
          </div>
        </div>
        <div class="row2">
          <div><label for="pc-max">Max uses (optional)</label>
            <input type="number" id="pc-max" min="1" placeholder="Unlimited">
          </div>
          <div><label for="pc-expires">Expires (optional)</label>
            <input type="date" id="pc-expires">
          </div>
        </div>
        <button class="btn" id="pc-add" style="width:100%;margin-top:16px;">Create code</button>
        <div class="err-msg" id="pc-err"></div>
      </div>`;
    if (!promoCodes.length){
      el.innerHTML = lmHtml + formHtml + `<div class="empty">No promo codes yet.</div>`;
    } else {
      const rows = promoCodes.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(p => {
        const expired = p.expiresAt && p.expiresAt < today;
        const usedUp = p.maxUses != null && p.usedCount >= p.maxUses;
        const status = !p.active ? 'Disabled' : expired ? 'Expired' : usedUp ? 'Used up' : 'Active';
        const statusColor = status === 'Active' ? 'var(--teal-dark)' : 'var(--red)';
        return `
        <div class="blk ${p.active && !expired && !usedUp ? 'booked' : ''}">
          <div>
            <div class="bd">${p.code}</div>
            <div class="bn">${p.type === 'percent' ? p.value + '% off' : money(p.value) + ' off'} · used ${p.usedCount}${p.maxUses != null ? ' / ' + p.maxUses : ''}${p.expiresAt ? ' · expires ' + p.expiresAt : ''}</div>
            <div class="bn" style="color:${statusColor};margin-top:3px;font-weight:600;">${status}</div>
          </div>
          <button class="btn ghost sm" data-toggle-promo="${p.code}">${p.active ? 'Disable' : 'Enable'}</button>
        </div>`;
      }).join('');
      el.innerHTML = lmHtml + formHtml + rows;
    }
    $('lm-toggle').addEventListener('change', async (e) => {
      lastMinuteEnabled = e.target.checked;
      await apiFetch('/api/settings.php?action=set_last_minute', { method: 'POST', body: JSON.stringify({ enabled: lastMinuteEnabled }) });
    });
    $('pc-add').addEventListener('click', async () => {
      const code = $('pc-code').value.trim().toUpperCase();
      const type = $('pc-type').value;
      const value = parseFloat($('pc-value').value);
      const maxUses = $('pc-max').value ? parseInt($('pc-max').value) : null;
      const expiresAt = $('pc-expires').value || null;
      if (!code){ $('pc-err').textContent = 'Enter a code.'; return; }
      if (!value || value <= 0){ $('pc-err').textContent = 'Enter a value greater than 0.'; return; }
      if (type === 'percent' && value > 100){ $('pc-err').textContent = 'Percent off cannot exceed 100.'; return; }
      try {
        await apiFetch('/api/promo.php?action=create', { method: 'POST', body: JSON.stringify({ code, type, value, maxUses, expiresAt }) });
      } catch (e){ $('pc-err').textContent = e.message; return; }
      $('pc-err').textContent = '';
      promoCodes = (await apiFetch('/api/promo.php?action=list')).codes || [];
      renderAdmin();
    });
    el.querySelectorAll('[data-toggle-promo]').forEach(btn => btn.addEventListener('click', async () => {
      await apiFetch('/api/promo.php?action=toggle', { method: 'POST', body: JSON.stringify({ code: btn.dataset.togglePromo }) });
      promoCodes = (await apiFetch('/api/promo.php?action=list')).codes || [];
      renderAdmin();
    }));
  } else if (admView === 'inventory'){
    const openDates = openDatesInWindow(14);
    const REGION_LABEL_FLEX = { central: 'Central FL', north: 'North FL', south: 'South FL' };
    const urgent = openDates.filter(d => d.daysOut <= 3);
    const upcoming = openDates.filter(d => d.daysOut > 3);
    const clients = pastClientList();
    const needsFeedback = bookingsNeedingFeedback();

    const feedbackNeededHtml = needsFeedback.length ? `
      <div class="admin-card" style="margin-bottom:20px;">
        <h3>Completed bookings awaiting feedback (${needsFeedback.length})</h3>
        ${needsFeedback.map(b => { const daysSince = Math.floor((Date.now() - new Date(b.completedAt).getTime()) / 864e5); return `
          <div class="blk" style="margin-bottom:8px;">
            <div><div class="bd">${b.who || b.email}</div><div class="bn">${b.title} · completed ${new Date(b.completedAt).toLocaleDateString()} · ${daysSince} day${daysSince !== 1 ? 's' : ''} ago${b.feedbackReminderSentAt ? ' · 1 reminder sent' : ''}</div></div>
            <button class="btn ghost sm" data-draft-feedback="${b.who || b.email}|${b.id}">Draft request</button>
          </div>`; }).join('')}
        <div class="admin-card hidden" id="feedback-draft-card" style="margin-top:14px;">

    const vdCopyBtn = $('vd-copy');
    if (vdCopyBtn) vdCopyBtn.addEventListener('click', async () => {
      const text = `Subject: ${$('vd-subject').value}\n\n${$('vd-body').value}`;
      try {
        await navigator.clipboard.writeText(text);
        $('vd-copied').textContent = 'Copied!';
      } catch {
        $('vd-copied').textContent = 'Select the text above and copy manually.';
      }
      setTimeout(() => { $('vd-copied').textContent = ''; }, 3000);
    });

    el.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', async () => {
      try { await apiFetch('/api/standing.php?action=approve', { method: 'POST', body: JSON.stringify({ id: btn.dataset.approve }) }); }
      catch (e) { alert(e.message); return; }
      standingRequests = (await apiFetch('/api/standing.php?action=list_pending')).requests || [];
      standingAgreements = (await apiFetch('/api/standing.php?action=list_agreements')).agreements || [];
      await loadAvailability();
      renderAdmin();
    }));
    el.querySelectorAll('[data-decline]').forEach(btn => btn.addEventListener('click', async () => {
      await apiFetch('/api/standing.php?action=decline', { method: 'POST', body: JSON.stringify({ id: btn.dataset.decline }) });
      standingRequests = (await apiFetch('/api/standing.php?action=list_pending')).requests || [];
      renderAdmin();
    }));
    el.querySelectorAll('[data-cancel-agreement]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm(`Cancel this standing agreement? Dates before ${cancelCutoff} (30 days out) still occur as scheduled. Dates after that are released.`)) return;
      await apiFetch('/api/standing.php?action=cancel_agreement', { method: 'POST', body: JSON.stringify({ id: btn.dataset.cancelAgreement }) });
      standingAgreements = (await apiFetch('/api/standing.php?action=list_agreements')).agreements || [];
      await loadAvailability();
      renderAdmin();
    }));
  } else if (admView === 'analytics'){
    const an = latestAnalytics;
    if (!an){ el.innerHTML = `<div class="empty">Couldn't load analytics right now.</div>`; return; }
    const REGION_LABEL = { central: 'Central FL', north: 'North FL', south: 'South FL' };
    const MONTH_LABEL = m => { const [y,mo] = m.split('-'); return new Date(y, mo-1, 1).toLocaleString('en-US', {month:'short', year:'numeric'}); };

    const metricCard = (label, value, sub) => `
      <div class="an-card">
        <div class="an-label">${label}</div>
        <div class="an-value">${value}</div>
        ${sub ? `<div class="an-sub">${sub}</div>` : ''}
      </div>`;

    const cardsHtml = `
      <div class="an-grid">
        ${metricCard('Average booking value', money(an.avgBookingValue), `${an.totalEver} bookings tracked`)}
        ${metricCard('Cancellation rate', `${Math.round(an.cancellationRate*100)}%`, `${an.cancelledCount} of ${an.totalEver} ever created`)}
        ${metricCard('Booking lead time', an.avgLeadTime != null ? `${Math.round(an.avgLeadTime)} days` : 'Not enough data', an.leadTimeSampleSize ? `avg over ${an.leadTimeSampleSize} bookings` : 'needs bookings made after this update')}
        ${metricCard('Clinic retention', `${Math.round(an.retentionRate*100)}%`, `${an.clientCount} distinct clients`)}
        ${metricCard('Recurring Clinic loyalty', `${an.recurringActiveCount}`, `of ${an.clientCount} clients hold the active 5% rate`)}
        ${metricCard('Average rating', an.avgRating != null ? `${an.avgRating.toFixed(1)} / 5` : 'No reviews yet', an.ratingSampleSize ? `from ${an.ratingSampleSize} reviews` : '')}
        ${metricCard('Utilization', `${Math.round(an.utilization*100)}%`, `next ${an.windowDays} days booked or blocked`)}
        ${metricCard('Flex Date conversion', an.flexPublished ? `${Math.round(an.flexConversionRate*100)}%` : 'N/A', an.flexPublished ? `${an.flexBooked} of ${an.flexPublished} published dates booked` : 'No Flex Rate dates published yet')}
        ${metricCard('Pricing elasticity', 'Not yet meaningful', 'needs more historical data across price points')}
      </div>`;

    const geoEntries = Object.entries(an.geo).sort((a,b) => b[1]-a[1]);
    const geoMax = Math.max(1, ...geoEntries.map(e => e[1]));
    const geoHtml = `
      <div class="admin-card" style="margin-top:20px;">
        <h3>Geographic demand</h3>
        ${geoEntries.length ? geoEntries.map(([region, count]) => `
          <div class="an-bar-row">
            <span class="an-bar-label">${REGION_LABEL[region] || region}</span>
            <div class="an-bar-track"><div class="an-bar-fill" style="width:${(count/geoMax*100).toFixed(0)}%;"></div></div>
            <span class="an-bar-val">${count}</span>
          </div>`).join('') : `<p style="font-size:0.85rem;color:#6b7280;">No region data yet.</p>`}
      </div>`;

    const seasonalEntries = Object.entries(an.seasonal).sort((a,b) => a[0].localeCompare(b[0]));
    const seasonalMax = Math.max(1, ...seasonalEntries.map(e => e[1]));
    const seasonalHtml = `
      <div class="admin-card" style="margin-top:20px;">
        <h3>Seasonal demand</h3>
        ${seasonalEntries.length ? seasonalEntries.map(([month, count]) => `
          <div class="an-bar-row">
            <span class="an-bar-label">${MONTH_LABEL(month)}</span>
            <div class="an-bar-track"><div class="an-bar-fill" style="width:${(count/seasonalMax*100).toFixed(0)}%;"></div></div>
            <span class="an-bar-val">${count}</span>
          </div>`).join('') : `<p style="font-size:0.85rem;color:#6b7280;">No date data yet.</p>`}
      </div>`;

    const barSection = (title, group, note) => {
      const entries = Object.entries(group || {});
      if (!entries.length) return `<div class="admin-card" style="margin-top:20px;"><h3>${title}</h3><p style="font-size:0.85rem;color:#6b7280;">${note}</p></div>`;
      const maxN = Math.max(1, ...entries.map(([,v]) => v.published));
      return `
        <div class="admin-card" style="margin-top:20px;">
          <h3>${title}</h3>
          ${entries.map(([label, v]) => `
            <div class="an-bar-row">
              <span class="an-bar-label">${label}</span>
              <div class="an-bar-track"><div class="an-bar-fill" style="width:${(v.published/maxN*100).toFixed(0)}%;"></div></div>
              <span class="an-bar-val">${Math.round(v.rate*100)}% of ${v.published}</span>
            </div>`).join('')}
        </div>`;
    };
    const flexDiscountHtml = barSection('Flex Rate conversion by discount level', an.flexByDiscount, 'No resolved Flex Rate listings yet — this fills in once published dates get booked or expire.');
    const flexRegionHtml = barSection('Flex Rate conversion by region', an.flexByRegion, 'No resolved Flex Rate listings yet.');
    const flexLeadHtml = barSection('Flex Rate conversion by how far ahead it was published', an.flexByLead, 'No resolved Flex Rate listings yet.');

    el.innerHTML = cardsHtml + geoHtml + seasonalHtml + flexDiscountHtml + flexRegionHtml + flexLeadHtml;
  } else if (admView === 'messages'){
    renderMessagesTab(el);
  } else if (admView === 'documents'){
    renderDocumentsTab(el);
  }
}
const DOC_LABELS = { license: 'Chiropractic license', malpractice: 'Malpractice insurance & certificate of insurance', w9: 'W-9 tax form' };
function renderDocumentsTab(el){
  el.innerHTML = `
    <div class="admin-card">
      <h3>Instantly-downloadable documents</h3>
      <p style="font-size:0.85rem;color:#6b7280;margin-bottom:14px;">Upload these once — they become instant downloads for every client in their Resources tab. Uploading a new file replaces the previous one.</p>
      ${Object.keys(DOC_LABELS).map(key => {
        const status = docStatus[key] || { available: false };
        return `
        <div class="blk ${status.available ? 'booked' : ''}" style="margin-bottom:10px;flex-direction:column;align-items:flex-start;">
          <div style="width:100%;">
            <div class="bd">${DOC_LABELS[key]}</div>
            <div class="bn">${status.available ? `Uploaded ${new Date(status.uploadedAt).toLocaleString()} · <a href="${status.url}" target="_blank" rel="noopener">View current file</a>` : 'Not uploaded yet — clients see a "Request a copy" option instead.'}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
            <input type="file" id="doc-file-${key}" accept=".pdf,.jpg,.jpeg,.png" style="font-size:0.8rem;">
            <button class="btn ghost sm" data-doc-upload="${key}">Upload</button>
          </div>
        </div>`;
      }).join('')}
      <div class="err-msg" id="doc-upload-err"></div>
    </div>`;
  el.querySelectorAll('[data-doc-upload]').forEach(btn => btn.addEventListener('click', async () => {
    const key = btn.dataset.docUpload;
    const fileInput = $(`doc-file-${key}`);
    const errEl = $('doc-upload-err');
    errEl.textContent = '';
    if (!fileInput.files.length){ errEl.textContent = 'Choose a file first.'; return; }
    const fd = new FormData();
    fd.append('key', key);
    fd.append('file', fileInput.files[0]);
    btn.disabled = true;
    try {
      const res = await fetch('/api/documents.php?action=upload', { method: 'POST', credentials: 'same-origin', body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Upload failed.');
      docStatus[key] = { available: true, url: data.url, uploadedAt: data.uploadedAt };
      renderDocumentsTab($('admin-list'));
    } catch (e) { errEl.textContent = e.message; btn.disabled = false; }
  }));
}
function renderMessagesTab(el){
  if (!chatThreads.length){
    el.innerHTML = `<div class="empty">No chat messages yet.</div>`;
    return;
  }
  const listHtml = `
    <div class="admin-card" style="margin-bottom:20px;">
      <h3>Conversations</h3>
      ${chatThreads.map(t => `
        <div class="blk ${t.unread ? 'booked' : ''} ${activeChatThread === t.threadKey ? '' : ''}" data-open-thread="${t.threadKey}" style="cursor:pointer;">
          <div>
            <div class="bd">${t.name || t.email || t.threadKey}${t.unread ? ` <span style="color:var(--red);">(${t.unread} new)</span>` : ''}</div>
            <div class="bn">${t.email || ''} · ${t.lastSender === 'admin' ? 'You: ' : ''}${(t.lastMessage || '').slice(0, 60)}</div>
            <div class="bn" style="color:#8a8171;">${new Date(t.lastAt).toLocaleString()}</div>
          </div>
        </div>`).join('')}
    </div>`;
  const threadHtml = activeChatThread ? `
    <div class="admin-card" id="thread-view-card">
      <h3>Conversation</h3>
      <div id="thread-messages" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        ${activeChatMessages.map(m => `
          <div class="blk ${m.sender === 'admin' ? '' : 'booked'}" style="flex-direction:column;align-items:flex-start;">
            <div class="bn" style="font-weight:600;">${m.sender === 'admin' ? 'You' : m.name}</div>
            <div style="font-size:0.85rem;">${String(m.message).replace(/</g,'&lt;')}</div>
            <div class="bn" style="color:#8a8171;margin-top:2px;">${new Date(m.createdAt).toLocaleString()}</div>
          </div>`).join('')}
      </div>
      <label for="thread-reply">Reply</label>
      <textarea id="thread-reply" rows="3" placeholder="Type your reply — it's emailed directly to them"></textarea>
      <button class="btn" id="thread-reply-send" style="width:100%;margin-top:10px;">Send reply</button>
    </div>` : '';
  el.innerHTML = listHtml + threadHtml;
  el.querySelectorAll('[data-open-thread]').forEach(row => row.addEventListener('click', async () => {
    activeChatThread = row.dataset.openThread;
    try { activeChatMessages = (await apiFetch('/api/chat.php?action=thread&threadKey=' + encodeURIComponent(activeChatThread))).messages || []; }
    catch (e) { activeChatMessages = []; }
    chatThreads = (await apiFetch('/api/chat.php?action=list_threads')).threads || [];
    renderMessagesTab($('admin-list'));
  }));
  const replySend = $('thread-reply-send');
  if (replySend) replySend.addEventListener('click', async () => {
    const text = $('thread-reply').value.trim();
    if (!text) return;
    replySend.disabled = true;
    try {
      await apiFetch('/api/chat.php?action=reply', { method: 'POST', body: JSON.stringify({ threadKey: activeChatThread, message: text }) });
      activeChatMessages = (await apiFetch('/api/chat.php?action=thread&threadKey=' + encodeURIComponent(activeChatThread))).messages || [];
      chatThreads = (await apiFetch('/api/chat.php?action=list_threads')).threads || [];
      renderMessagesTab($('admin-list'));
    } catch (e) { alert(e.message); replySend.disabled = false; }
  });
}
document.querySelectorAll('[data-adm]').forEach(t => t.addEventListener('click', async () => {
  document.querySelectorAll('[data-adm]').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); admView = t.dataset.adm;
  if (admView === 'blocks') await loadAvailability();
  if (admView === 'booked') await loadAdminBookings();
  if (admView === 'video'){
    try { videoRequests = (await apiFetch('/api/video.php?action=list')).requests || []; } catch (e) { videoRequests = []; }
  }
  if (admView === 'promo'){
    try { promoCodes = (await apiFetch('/api/promo.php?action=list')).codes || []; } catch (e) { promoCodes = []; }
  }
  if (admView === 'inventory'){
    await loadAdminBookings();
    try { flexRateDates = (await apiFetch('/api/flexrate.php?action=list')).flexRates || []; } catch (e) { flexRateDates = []; }
  }
  if (admView === 'standing'){
    try {
      standingRequests = (await apiFetch('/api/standing.php?action=list_pending')).requests || [];
      standingAgreements = (await apiFetch('/api/standing.php?action=list_agreements')).agreements || [];
    } catch (e) { standingRequests = []; standingAgreements = []; }
  }
  if (admView === 'analytics'){
    try { latestAnalytics = await apiFetch('/api/analytics.php?action=summary'); } catch (e) { latestAnalytics = null; }
  }
  if (admView === 'messages'){
    activeChatThread = null; activeChatMessages = [];
    try { chatThreads = (await apiFetch('/api/chat.php?action=list_threads')).threads || []; } catch (e) { chatThreads = []; }
  }
  if (admView === 'documents'){
    try { docStatus = await apiFetch('/api/documents.php?action=status'); } catch (e) { docStatus = {}; }
  }
  renderAdmin();
}));
$('bl-add').addEventListener('click', async () => {
  const start = $('bl-start').value, end = $('bl-end').value || $('bl-start').value;
  if (!start){ $('bl-err').textContent = 'Pick a start date.'; return; }
  if (end < start){ $('bl-err').textContent = 'End date is before the start date.'; return; }
  $('bl-err').textContent = '';
  try {
    await apiFetch('/api/booking.php?action=blackout_add', { method: 'POST', body: JSON.stringify({
      start, end, scope: $('bl-scope').value, note: $('bl-note').value.trim()
    })});
  } catch (e) { $('bl-err').textContent = e.message; return; }
  $('bl-start').value = ''; $('bl-end').value = ''; $('bl-note').value = '';
  admView = 'blocks';
  document.querySelectorAll('[data-adm]').forEach(x => x.classList.toggle('on', x.dataset.adm === 'blocks'));
  await loadAvailability();
  renderAdmin();
});


async function initAdminPage(){
  try { user = (await apiFetch('/api/auth.php?action=me')).user || null; }
  catch (e) { user = null; }
  renderAuthState();
  if (!user || !isAdmin){ window.location.href = 'index.html'; return; }
  await loadAvailability();
  renderAdmin();
}
initAdminPage();

</script>
